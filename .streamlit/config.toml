# Streamlit settings for the rep UI (streamlit run streamlit_app.py).

[theme]
# Less space above the title, so the table and the detail tabs fit one 1440x900 screen.
paddingTop = "0.5rem"

# The accent color goes under each mode, never under plain [theme]: a color there pins the app to light mode.
# A calm blue instead of the default red, which made the selected row look like an error.
[theme.light]
primaryColor = "#2f6fdb"

[theme.dark]
primaryColor = "#6ea8fe"

[client]
# Hides Deploy and the menu. Switch light and dark mode from the operating system.
toolbarMode = "minimal"

[server]
# Rerun the open tab whenever a source file is saved.
runOnSave = true
